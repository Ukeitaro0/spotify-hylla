// --- Huvudytan
function renderMain() {
  const main = $('main'); main.innerHTML = '';
  main.classList.toggle('selecting', selecting);
  const v = route.view;
  activeQuery = v === 'search' ? query : '';
  mainFilter = v === 'genre' ? route.genre : null;
  subFilter = v === 'genre' ? (route.sub || null) : null;
  tab = v === 'genre' ? (genreMode === 'albums' ? 'albums' : 'tracks') : v;
  if (v === 'home') return viewHome(main);
  if (v === 'genres') return viewGenres(main);
  if (v === 'playlists') return viewPlaylists(main);
  if (v === 'search') return viewSearch(main);
  if (!tracks.length) { vhead(main, { title: plName() }); main.appendChild(el('div', 'center', 'Spellistan är tom, eller går inte att läsa (Spotify lämnar bara ut innehåll i listor du äger eller samarbetar på).')); return; }
  if (v === 'genre') return viewGenre(main);
  const titles = { albums: 'Album', artists: 'Artister', tracks: 'Alla låtar', loose: 'Övriga låtar' };
  vhead(main, { title: titles[v], sub: plName(), back: libBack(), actions: [v !== 'artists' ? sortSelect(v !== 'albums') : null] });
  if (v === 'albums') listAlbums(main);
  if (v === 'artists') listArtists(main);
  if (v === 'tracks' || v === 'loose') listTracks(main, v === 'loose');
}

function viewHome(main) {
  vhead(main, { title: 'Bibliotek', big: true, actions: [gearBtn()] });
  const pill = btn('plpill', `<span></span>${icon('down', 'ico')}`, () => navigate({ view: 'playlists' }));
  pill.querySelector('span').textContent = plName(); main.appendChild(pill);
  const rows = el('div', 'librows');
  [['album', 'Album', albums.length, 'albums'], ['artist', 'Artister', artistCount(), 'artists'], ['note', 'Alla låtar', tracks.length, 'tracks'], ['loose', 'Övriga låtar', loose.length, 'loose']]
    .forEach(([ic, l, c, view]) => rows.appendChild(btn('librow', `${icon(ic)}<span class="lbl">${l}</span><span class="c">${c.toLocaleString('sv')}</span>${icon('right', 'ico')}`, () => navigate({ view }))));
  main.appendChild(rows);
  if (!tracks.length) return main.appendChild(el('div', 'center', 'Hämtar låtar…'));
  const recent = [...albums].sort((a, b) => (b.added || '').localeCompare(a.added || '')).slice(0, 6);
  if (recent.length) { main.appendChild(el('div', 'sect', 'Senast tillagt')); main.appendChild(grid(recent)); }
}

function viewGenres(main) {
  vhead(main, { title: 'Genrer', big: true, sub: plName(), actions: [isDesk() ? null : gearBtn()] });
  const { list, noneA, noneT } = genreStats();
  const box = el('div', 'gtiles');
  const tile = (g, color, a, t, subs, r) => {
    const b = btn('gtile', '<div class="n"></div><div><div class="m"></div><div class="x"></div></div>', () => navigate(r));
    b.style.background = color;
    b.querySelector('.n').textContent = g; b.querySelector('.m').textContent = countText(a, t); b.querySelector('.x').textContent = subs;
    box.appendChild(b);
  };
  list.forEach(([g, st]) => tile(g, genreColor(g), st.albums, st.tracks,
    [...st.subs.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => x[0]).join(' · '), { view: 'genre', genre: g }));
  if (noneA + noneT) tile('Utan egen genre', '#3a3c47', noneA, noneT, 'Sätt genre på dem', { view: 'genre', genre: NONE });
  if (!list.length && !(noneA + noneT)) main.appendChild(el('div', 'center', 'Inga genrer än.'));
  main.appendChild(box);
}

function viewGenre(main) {
  const g = route.genre, none = g === NONE;
  const st = genreStats().list.find(([n]) => n === g)?.[1];
  vhead(main, { title: none ? 'Utan egen genre' : g, sub: (route.sub ? route.sub + ' · ' : '') + plName(),
    back: isDesk() ? null : { label: 'Genrer', route: { view: 'genres' } }, actions: [sortSelect(genreMode !== 'albums')] });
  if (st && st.subs.size) {
    const chips = el('div', 'gchips');
    const add = (label, on, r, c) => { const b = el('button', 'chip' + (on ? ' on' : ''), label); if (c != null) b.appendChild(el('span', 'c', String(c))); b.onclick = () => navigate(r, false); chips.appendChild(b); };
    add('Alla ' + g.toLowerCase(), !route.sub, { view: 'genre', genre: g });
    [...st.subs.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'sv')).forEach(([sg, n]) => add(sg, route.sub === sg, { view: 'genre', genre: g, sub: sg }, n));
    main.appendChild(chips);
  }
  const seg = el('div', 'seg small');
  [['albums', 'Album'], ['tracks', 'Låtar']].forEach(([m, l]) => {
    const b = el('button', genreMode === m ? 'on' : '', l);
    b.onclick = () => { genreMode = m; store.set('genre_mode', m); if (selecting) exitSelect(); else renderMain(); };
    seg.appendChild(b);
  });
  main.appendChild(seg);
  if (genreMode === 'albums') {
    listAlbums(main);
    const ls = loose.filter(x => matchesGenre(x.t.album.id));
    if (ls.length) {
      main.appendChild(el('div', 'sect', 'Lösa låtar'));
      const uris = ls.map(x => x.t.uri), l = el('div', 'list');
      ls.forEach((x, i) => l.appendChild(trackRow(x.t, { menu: true, onPlay: () => play({ uris, offset: { position: i } }, x.t.uri) })));
      main.appendChild(l);
    }
  } else listTracks(main, false);
}

function viewPlaylists(main) {
  vhead(main, { title: 'Spellistor', big: true, sub: `${plMap.size} listor`, actions: [isDesk() ? null : gearBtn()] });
  const inp = el('input', 'plsearch'); inp.type = 'search'; inp.placeholder = 'Sök spellista'; inp.value = plQuery;
  const box = el('div');
  inp.oninput = () => { plQuery = inp.value; renderPlaylistList(box, plQuery, 'plrow'); };
  main.appendChild(inp); main.appendChild(box);
  renderPlaylistList(box, plQuery, 'plrow');
}

function viewSearch(main) {
  vhead(main, { title: 'Sök', big: true, sub: plName() });
  const res = el('div');
  if (!isDesk()) {
    const inp = el('input', 'searchbox'); inp.type = 'search'; inp.placeholder = 'Artist, album eller låt'; inp.value = query;
    inp.oninput = () => { query = inp.value; activeQuery = query; renderSearchResults(res); };
    main.appendChild(inp);
  }
  main.appendChild(res); renderSearchResults(res);
}
function renderSearchResults(res) {
  res.innerHTML = '';
  if (!query.trim()) { res.appendChild(el('div', 'center', 'Skriv för att söka i ' + plName() + '.')); return; }
  const al = sortAlbums(albums.filter(a => matchesSearch(a.name, a.artist))).slice(0, 12);
  const tr = tracks.filter(x => matchesSearch(x.t.name, artistNames(x.t.artists), x.t.album.name)).slice(0, 100);
  if (al.length) { res.appendChild(el('div', 'sect', 'Album')); res.appendChild(grid(al)); }
  if (tr.length) {
    res.appendChild(el('div', 'sect', 'Låtar'));
    const uris = tr.map(x => x.t.uri), l = el('div', 'list');
    tr.forEach((x, i) => l.appendChild(trackRow(x.t, { menu: true, onPlay: () => play({ uris, offset: { position: i } }, x.t.uri) })));
    res.appendChild(l);
  }
  if (!al.length && !tr.length) res.appendChild(el('div', 'center', 'Inga träffar.'));
}

// --- Listor (används av både biblioteket och genrevyn)
function listAlbums(main) {
  const list = sortAlbums(albums.filter(a => matchesGenre(a.id)));
  main.appendChild(toolbar(list.length + ' album', list.map(a => a.id)));
  if (!list.length) return main.appendChild(el('div', 'center', 'Inga album här.'));
  if (sortVal === 'genre' && route.view !== 'genre') {
    const groups = new Map();
    list.forEach(a => { const g = infoFor(a.id).main || 'Ingen genre angiven'; (groups.get(g) || groups.set(g, []).get(g)).push(a); });
    groups.forEach((l, g) => { const h = el('div', 'artist-h'); h.appendChild(el('div', 'n', g));
      const subs = [...new Set(l.flatMap(a => infoFor(a.id).subs))]; if (subs.length) h.appendChild(el('div', 'g', subs.join(' · '))); main.appendChild(h); main.appendChild(grid(l)); });
  } else main.appendChild(grid(list));
}

function listArtists(main) {
  const groups = new Map();
  const g = n => groups.get(n) || groups.set(n, { albums: [], loose: [] }).get(n);
  albums.forEach(a => g(primaryArtist(a.artists)).albums.push(a));
  loose.forEach(x => g(primaryArtist(x.t.artists)).loose.push(x));
  const names = [...groups.keys()].sort((a, b) => sortKey(a).localeCompare(sortKey(b), 'sv'));
  if (!names.length) return main.appendChild(el('div', 'center', 'Inga artister.'));
  names.forEach(n => {
    const grp = groups.get(n);
    const list = grp.albums.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const h = el('div', 'artist-h');
    h.appendChild(el('div', 'n', n));
    const gs = [...new Set([...list.map(a => a.id), ...grp.loose.map(x => x.t.album.id)].flatMap(genresFor))].slice(0, 4);
    if (gs.length) h.appendChild(el('div', 'g', gs.join(' · ')));
    main.appendChild(h);
    if (list.length) main.appendChild(grid(list));
    if (grp.loose.length) {
      if (list.length) main.appendChild(el('div', 'loose-h', 'Lösa låtar'));
      const ls = grp.loose.sort((a, b) => (b.t.album.release_date || '').localeCompare(a.t.album.release_date || ''));
      const uris = ls.map(x => x.t.uri), l = el('div', 'list');
      ls.forEach((x, i) => l.appendChild(trackRow(x.t, { menu: true, onPlay: () => play({ uris, offset: { position: i } }, x.t.uri) })));
      main.appendChild(l);
    }
  });
}

function listTracks(main, isLoose) {
  const s = sortVal;
  const source = isLoose ? loose : tracks;
  const byArtist = (a, b) => sortKey(artistNames(a.t.artists)).localeCompare(sortKey(artistNames(b.t.artists)), 'sv')
    || sortKey(a.t.album.name).localeCompare(sortKey(b.t.album.name), 'sv') || (a.t.disc_number - b.t.disc_number) || (a.t.track_number - b.t.track_number);
  const list = source.filter(x => matchesGenre(x.t.album.id) && (!isLoose || !dupOnly || isDup(x.t))).sort((a, b) =>
    s === 'added' ? (b.added || '').localeCompare(a.added || '') :
    s === 'date' ? (b.t.album.release_date || '').localeCompare(a.t.album.release_date || '') || byArtist(a, b) :
    s === 'name' ? sortKey(a.t.name).localeCompare(sortKey(b.t.name), 'sv') :
    s === 'playlist' ? (plIndex.get(a.t.uri) ?? 0) - (plIndex.get(b.t.uri) ?? 0) :
    s === 'genre' ? (infoFor(a.t.album.id).main || '~').localeCompare(infoFor(b.t.album.id).main || '~', 'sv') || byArtist(a, b) :
    byArtist(a, b));
  const uris = list.map(x => x.t.uri);
  const playBtn = el('button', 'primary', '▶  Spela alla');
  playBtn.onclick = () => play({ uris: uris.slice(0, 500) });
  main.appendChild(toolbar(list.length + ' låtar', uris, list.length && !selecting ? playBtn : null));
  const nDup = loose.filter(x => isDup(x.t)).length;
  if (isLoose && (nDup || dupOnly)) {
    const db = el('button', 'chip warn' + (dupOnly ? ' on' : ''), (dupOnly ? '✓ ' : '') + 'Dubbletter som finns på album');
    db.appendChild(el('span', 'c', String(nDup))); db.style.marginBottom = '12px';
    db.onclick = () => { dupOnly = !dupOnly; renderMain(); };
    main.appendChild(db);
  }
  if (!list.length) return main.appendChild(el('div', 'center', isLoose ? 'Inga lösa låtar här.' : 'Inga låtar här.'));
  const l = el('div', 'list');
  list.forEach((x, i) => l.appendChild(trackRow(x.t, { showGenre: true, menu: true, onPlay: () => play({ uris: uris.slice(0, 500), offset: { position: Math.min(i, 499) } }, x.t.uri) })));
  main.appendChild(l);
}

// ===== Välj flera och sätt genre =====
function toolbar(info, visibleIds, extra) {
  const tb = el('div', 'toolbar');
  tb.appendChild(el('div', 'info', selecting ? `${selected.size} valda` : info));
  const r = el('div', 'r');
  if (extra) r.appendChild(extra);
  if (selecting) {
    const all = el('button', null, 'Markera alla');
    all.onclick = () => { visibleIds.forEach(id => selected.add(id)); updateSelbar(); render(); };
    r.appendChild(all);
  }
  if (tab !== 'artists') {
    const b = el('button', null, selecting ? 'Klar' : 'Välj');
    b.onclick = () => selecting ? exitSelect() : enterSelect();
    r.appendChild(b);
  }
  tb.appendChild(r);
  return tb;
}
function enterSelect() { selecting = true; selected.clear(); updateSelbar(); render(); }
function exitSelect() { if (!selecting) return; selecting = false; selected.clear(); updateSelbar(); render(); }
function toggleSel(id) { selected.has(id) ? selected.delete(id) : selected.add(id); updateSelbar(); render(); }
function updateSelbar() {
  $('selbar').classList.toggle('on', selecting);
  $('selDel').hidden = !(tab === 'loose' || tab === 'tracks');
  $('selDel').disabled = !selected.size; $('selDel').style.opacity = selected.size ? 1 : .5;
  $('selGo').textContent = selected.size ? `Sätt genre (${selected.size})` : 'Sätt genre';
  $('selGo').disabled = !selected.size; $('selGo').style.opacity = selected.size ? 1 : .5;
}
$('selCancel').onclick = exitSelect;
const selectedAlbumIds = () => (tab === 'loose' || tab === 'tracks')
  ? [...new Set(tracks.filter(x => selected.has(x.t.uri)).map(x => x.t.album.id))]
  : [...selected];
$('selGo').onclick = () => { if (selected.size) openGenreSheet(selectedAlbumIds()); };
$('selDel').onclick = () => { if (selected.size && (tab === 'loose' || tab === 'tracks')) confirmRemove([...selected]); };

// ===== Meny för en enskild låt: spela, genre, ta bort =====
function openTrackMenu(t) {
  const inner = $('sheetInner'); inner.innerHTML = ''; inner.scrollTop = 0;
  $('bgart').style.backgroundImage = `url("${bestImage(t.album.images, 600)}")`;
  const head = el('div', 'mhead');
  const img = el('img'); img.src = bestImage(t.album.images, 300); img.alt = ''; head.appendChild(img);
  const info = el('div'); info.appendChild(el('div', 't', t.name));
  info.appendChild(el('div', 's', artistNames(t.artists) + ' · ' + t.album.name + (t.album.release_date ? ' · ' + year(t.album.release_date) : '')));
  head.appendChild(info); inner.appendChild(head);

  const act = el('div', 'mact');
  const pb = el('button', 'primary', '▶  Spela');
  pb.onclick = () => { play({ context_uri: t.album.uri, offset: { uri: t.uri } }, t.uri); closeSheet(); };
  act.appendChild(pb);
  const alb = albums.find(a => a.id === t.album.id);
  if (alb) { const ab = el('button', null, 'Visa albumet'); ab.onclick = () => openAlbum(alb); act.appendChild(ab); }
  inner.appendChild(act);

  const box = el('div', 'settings'); box.appendChild(el('h3', null, 'Genre')); inner.appendChild(box);
  const siblings = tracks.filter(x => x.t.album.id === t.album.id).length;
  if (siblings > 1) inner.appendChild(el('div', 'gscope', `Gäller hela albumet ”${t.album.name}” (${siblings} låtar i listan).`));
  inner.appendChild(genreEditor([t.album.id], () => {}));

  const del = el('button', 'danger', 'Ta bort ur spellistan'); del.style.marginTop = '8px';
  del.onclick = () => confirmRemove([t.uri]);
  inner.appendChild(del);
  showSheet();
}

// ===== Ta bort låtar ur spellistan =====
const canModify = () => (store.get('scope') || '').includes('playlist-modify');
function confirmRemove(uris) {
  const inner = $('sheetInner'); inner.innerHTML = ''; inner.scrollTop = 0;
  $('bgart').style.backgroundImage = 'none';
  const box = el('div', 'settings');
  const pl = plMap.get(curId)?.name || 'spellistan';
  box.appendChild(el('h3', null, `Ta bort ${uris.length} ${uris.length === 1 ? 'låt' : 'låtar'} från ”${pl}”?`));
  if (!canModify()) {
    box.appendChild(el('p', null, 'Sidan behöver ny behörighet för att få ändra i dina spellistor. Logga in med Spotify en gång till, sedan fungerar det.'));
    const b = el('button', 'primary', 'Logga in igen'); b.onclick = login; box.appendChild(b);
    inner.appendChild(box); showSheet(); return;
  }
  box.appendChild(el('p', null, 'Låtarna tas bort ur spellistan i Spotify. De finns kvar i Spotify i övrigt, men det går inte att ångra härifrån.'));
  const l = el('div', 'list confirm-list');
  tracks.filter(x => uris.includes(x.t.uri)).forEach(x => l.appendChild(trackRow(x.t, { onPlay: () => {} })));
  box.appendChild(l);
  const row = el('div', 'row');
  const go = el('button', 'danger solid', 'Ta bort');
  const no = el('button', null, 'Avbryt'); no.onclick = closeSheet;
  go.onclick = async () => {
    go.disabled = true; go.textContent = 'Tar bort…';
    try { await removeFromPlaylist(uris); exitSelect(); closeSheet(); toast(`Tog bort ${uris.length} ${uris.length === 1 ? 'låt' : 'låtar'}`); }
    catch (e) {
      go.disabled = false; go.textContent = 'Ta bort';
      if (e.status === 401 || e.status === 403) { toast('Spotify nekade. Prova att logga in igen.', 4000); }
      else toast('Fel: ' + e.message, 4000);
    }
  };
  row.appendChild(no); row.appendChild(go); box.appendChild(row);
  inner.appendChild(box); showSheet();
}
async function removeFromPlaylist(uris) {
  let snapshot = null;
  for (let i = 0; i < uris.length; i += 100) {
    const r = await api(`/playlists/${curId}/items`, { method: 'DELETE', body: JSON.stringify({ items: uris.slice(i, i + 100).map(uri => ({ uri })) }) });
    if (r && r.snapshot_id) snapshot = r.snapshot_id;
  }
  const gone = new Set(uris);
  const items = tracks.filter(x => !gone.has(x.t.uri));
  if (snapshot && plMap.get(curId)) plMap.get(curId).snapshot_id = snapshot;
  writeCache({ id: curId, snapshot, items });
  build(items); render();
}

function openGenreSheet(ids) {
  const inner = $('sheetInner'); inner.innerHTML = ''; inner.scrollTop = 0;
  const first = albums.find(a => a.id === ids[0]) || (loose.find(x => x.t.album.id === ids[0]) || {}).t?.album;
  $('bgart').style.backgroundImage = first ? `url("${first.imgBig || bestImage(first.images, 600)}")` : 'none';
  const box = el('div', 'settings');
  box.appendChild(el('h3', null, ids.length === 1 ? 'Sätt genre' : `Sätt genre på ${ids.length} st`));
  box.appendChild(el('p', null, 'Huvudgenre ersätter den befintliga på alla valda. Subgenrer läggs till på alla, eller tas bort från alla om alla redan har den. Streckad = bara vissa av de valda har den.'));
  inner.appendChild(box);
  inner.appendChild(genreEditor(ids, () => {}));
  const done = el('button', 'primary', 'Klar'); done.style.width = '100%';
  done.onclick = () => { exitSelect(); closeSheet(); };
  inner.appendChild(done);
  showSheet();
}

// Redigering av huvudgenre + subgenrer, för ett eller flera album-id
function genreEditor(ids, onChange) {
  const editor = el('div', 'gedit');
  const canon = (v, pool) => { v = v.trim(); if (!v) return ''; return pool.find(n => n.toLowerCase() === v.toLowerCase()) || cap(v); };
  const paint = () => {
    editor.innerHTML = '';
    const infos = ids.map(ownFor);
    const sameMain = infos.every(o => o.main === infos[0].main) ? infos[0].main : '';
    const commit = () => { store.set('own_genres_v1', JSON.stringify(localGenres)); onChange(); paint(); };
    const setMain = g => {
      const clear = infos.every(o => o.main === g);
      ids.forEach(id => { const o = ownFor(id); setOwn(id, { main: clear ? '' : g, subs: o.subs.filter(x => x !== g) }, false); });
      commit();
    };
    const toggleSub = g => {
      const all = infos.every(o => o.subs.includes(g));
      ids.forEach(id => { const o = ownFor(id);
        const subs = all ? o.subs.filter(x => x !== g) : (o.subs.includes(g) ? o.subs : [...o.subs, g]);
        setOwn(id, { main: o.main, subs: subs.filter(x => x !== o.main) }, false); });
      commit();
    };
    const state = test => { const n = infos.filter(test).length; return n === infos.length ? ' on' : n ? ' part' : ''; };
    const chip = (wrap, label, cls, fn) => { const c = el('button', 'chip' + cls, label); c.onclick = fn; wrap.appendChild(c); };
    const inputRow = (ph, onAdd) => {
      const row = el('div', 'add'); const inp = el('input'); inp.placeholder = ph; inp.enterKeyHint = 'done';
      const b = el('button', null, 'Lägg till'); const go = () => { if (inp.value.trim()) onAdd(inp.value); };
      b.onclick = go; inp.onkeydown = e => { if (e.key === 'Enter') go(); };
      row.appendChild(inp); row.appendChild(b); return row;
    };
    // Last.fm-förslag, vanligast först bland de valda
    const lfCount = new Map();
    ids.forEach(id => (genreCache[id]?.g || []).map(cap).forEach(g => lfCount.set(g, (lfCount.get(g) || 0) + 1)));
    const lf = [...lfCount.entries()].sort((a, b) => b[1] - a[1]).map(x => x[0]).slice(0, 5);

    editor.appendChild(el('div', 'lbl', 'Huvudgenre (en)'));
    const w1 = el('div', 'wrap');
    const mains = [...new Set([...infos.map(o => o.main), ...ownNames('main')].filter(Boolean))];
    mains.forEach(g => chip(w1, g, state(o => o.main === g), () => setMain(g)));
    lf.filter(g => !mains.some(m => m.toLowerCase() === g.toLowerCase())).slice(0, 2).forEach(g => chip(w1, '+ ' + g, ' sug', () => setMain(g)));
    editor.appendChild(w1);
    editor.appendChild(inputRow('Ny huvudgenre…', v => setMain(canon(v, ownNames('main')))));

    editor.appendChild(el('div', 'lbl', 'Subgenrer (flera)'));
    const w2 = el('div', 'wrap');
    const near = sameMain ? ownNames('subs', sameMain) : [];
    const subs = [...new Set([...infos.flatMap(o => o.subs), ...near, ...ownNames('subs')])].filter(g => g !== sameMain);
    subs.forEach(g => chip(w2, g, state(o => o.subs.includes(g)), () => toggleSub(g)));
    lf.filter(g => g.toLowerCase() !== (sameMain || '').toLowerCase() && !subs.some(m => m.toLowerCase() === g.toLowerCase()))
      .forEach(g => chip(w2, '+ ' + g, ' sug', () => toggleSub(g)));
    editor.appendChild(w2);
    editor.appendChild(inputRow('Ny subgenre…', v => toggleSub(canon(v, ownNames('subs')))));
  };
  paint();
  return editor;
}

// ===== Albumvy: stängs med ✕, tryck utanför, Esc, dra nedåt eller telefonens bakåtknapp =====
let sheetOpen = false;
function openAlbum(a) {
  const inner = $('sheetInner'); inner.innerHTML = ''; inner.scrollTop = 0;
  $('bgart').style.backgroundImage = `url("${a.imgBig}")`;
  const hero = el('div', 'hero');
  const img = el('img'); img.src = a.imgBig; img.alt = ''; hero.appendChild(img);
  hero.appendChild(el('div', 't', a.name));
  hero.appendChild(el('div', 's', a.artist + (a.date ? ' · ' + year(a.date) : '') + ' · ' + a.items.length + ' låtar'));
  const gBox = el('div', 'g'); hero.appendChild(gBox);
  const pb = el('button', 'primary', '▶  Spela'); pb.onclick = () => play({ context_uri: a.uri }, a.uri);
  hero.appendChild(pb);
  const eb = el('button', 'linkbtn', '✎ Ändra genrer'); hero.appendChild(el('br')); hero.appendChild(eb);
  inner.appendChild(hero);
  const paintGenres = () => {
    gBox.innerHTML = '';
    const i = infoFor(a.id);
    if (i.main) gBox.appendChild(el('span', 'main', i.main));
    i.subs.forEach(x => gBox.appendChild(el('span', null, x)));
    if (!i.own && (i.main || i.subs.length)) gBox.appendChild(el('span', 'src', 'från Last.fm'));
  };
  const editor = genreEditor([a.id], paintGenres); editor.hidden = true; inner.appendChild(editor);
  eb.onclick = () => { editor.hidden = !editor.hidden; eb.textContent = editor.hidden ? '✎ Ändra genrer' : '✓ Klar'; };
  paintGenres();
  const l = el('div', 'list');
  a.items.forEach(x => l.appendChild(trackRow(x.t, { num: x.t.track_number, showCover: false,
    onPlay: () => play({ context_uri: a.uri, offset: { uri: x.t.uri } }, x.t.uri) })));
  inner.appendChild(l);
  showSheet();
}
function showSheet() {
  $('sheet').classList.add('on'); document.body.classList.add('locked');
  if (!sheetOpen) { history.pushState({ sheet: 1 }, ''); sheetOpen = true; }
}

function openSettings() {
  const inner = $('sheetInner'); inner.innerHTML = ''; inner.scrollTop = 0;
  $('bgart').style.backgroundImage = 'none';
  const box = el('div', 'settings');
  const rl = el('button', null, '⟳  Hämta om spellistan nu'); rl.style.marginBottom = '8px';
  rl.onclick = () => { closeSheet(); loadPlaylist(curId, true).catch(err => toast(err.message, 4000)); };
  box.appendChild(rl);
  // Inventering inför "Hela biblioteket"
  box.appendChild(el('h3', null, 'Bibliotek'));
  const inv = el('p', null, 'Räknar…'); box.appendChild(inv);
  (async () => {
    try {
      const me = await api('/me');
      const all = [...plMap.values()];
      const readable = all.filter(p => p.owner === me.id || p.collab);
      const sum = l => l.reduce((n, p) => n + (p.total || 0), 0);
      const unknown = readable.some(p => p.total == null);
      inv.textContent = `${all.length} spellistor totalt. ${readable.length} är dina egna eller samarbeten och går att läsa in, `
        + `med sammanlagt ${unknown ? 'okänt antal' : sum(readable).toLocaleString('sv')} låtar. `
        + `${all.length - readable.length} är andras listor som du följer, och dem lämnar Spotify inte ut.`;
      const others = all.filter(p => !(p.owner === me.id || p.collab));
      if (others.length) {
        const d = el('details'); d.style.margin = '-6px 0 16px'; d.style.color = 'var(--muted)'; d.style.fontSize = '13px';
        d.appendChild(el('summary', null, 'Visa vilka som inte går att läsa'));
        others.forEach(p => d.appendChild(el('div', null, `${p.name}  (ägare: ${p.owner || '?'})`)));
        inv.after(d);
      }
    } catch (e) { inv.textContent = 'Kunde inte räkna: ' + e.message; }
  })();
  box.appendChild(el('h3', null, 'Genrer'));
  setTimeout(() => box.appendChild(el('p', null, 'Version ' + BUILD)), 0);
  const n = Object.keys(exportGenres()).length, total = Object.values({ ...repoGenres, ...localGenres }).filter(v => { const o = norm(v); return o.main || o.subs.length; }).length;
  box.appendChild(el('p', null, n
    ? `${n} ändringar på den här enheten är inte uppladdade än (av ${total} album med genre). Kopiera och skicka dem till Claude. Ordningen mellan telefon och dator spelar ingen roll: det senast ändrade per album gäller.`
    : `Allt är uppladdat. ${total} album har genre.`));
  const lab = el('label'); const cb = el('input'); cb.type = 'checkbox'; cb.checked = useLastfm;
  cb.onchange = () => { useLastfm = cb.checked; store.set('use_lastfm', useLastfm ? '1' : '0'); render(); };
  lab.appendChild(cb); lab.appendChild(el('span', null, 'Visa Last.fm-genrer på album utan egna'));
  box.appendChild(lab);
  const json = JSON.stringify(exportGenres(), null, 1);
  const row = el('div', 'row');
  const dl = el('button', 'primary', 'Ladda ner genres.json');
  dl.onclick = () => { const u = URL.createObjectURL(new Blob([json], { type: 'application/json' })); const x = el('a'); x.href = u; x.download = 'genres.json'; document.body.appendChild(x); x.click(); x.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); };
  const cp = el('button', null, 'Kopiera');
  cp.onclick = async () => { try { await navigator.clipboard.writeText(json); toast('Kopierat'); } catch { ta.select(); toast('Markera och kopiera texten nedan'); } };
  row.appendChild(dl); row.appendChild(cp); box.appendChild(row);
  const ta = el('textarea'); ta.readOnly = true; ta.value = json; box.appendChild(ta);
  inner.appendChild(box);
  showSheet();
}
function hideSheet() {
  $('sheet').classList.remove('on'); document.body.classList.remove('locked');
  $('panel').style.transform = ''; sheetOpen = false;
  render();
}
function closeSheet() { if (sheetOpen) history.back(); else hideSheet(); }
window.addEventListener('popstate', e => {
  if (fullOpen) hideFull();
  else if (sheetOpen) hideSheet();
  else if (e.state && e.state.route) {
    if (selecting) { selecting = false; selected.clear(); updateSelbar(); }
    route = e.state.route; render(); window.scrollTo(0, e.state.y || 0);
  }
});
$('close').onclick = closeSheet;
$('sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetOpen) closeSheet(); });

// Dra nedåt för att stänga (från greppet, eller när listan är högst upp)
(() => {
  let y0 = null, dy = 0;
  const panel = $('panel'), sc = $('sheetInner');
  panel.addEventListener('touchstart', e => {
    const onGrab = e.target.id === 'grab';
    if (onGrab || sc.scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; } else y0 = null;
  }, { passive: true });
  panel.addEventListener('touchmove', e => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0) { panel.style.transition = 'none'; panel.style.transform = `translateY(${dy}px)`; }
  }, { passive: true });
  panel.addEventListener('touchend', () => {
    if (y0 == null) return;
    panel.style.transition = '';
    if (dy > 110) closeSheet(); else panel.style.transform = '';
    y0 = null;
  });
})();

// ===== Spelare: visar vad Spotify spelar just nu och styr den =====
const ICON_PLAY = '<path d="M7 4.5v15l13-7.5z"/>', ICON_PAUSE = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
let ps = null, psAt = 0, pollTimer = null;
function curPos() { if (!ps) return 0; return Math.min(ps.progress_ms + (ps.is_playing ? Date.now() - psAt : 0), ps.item.duration_ms); }
function paintProgress() {
  if (!ps) return;
  const pos = curPos(), dur = ps.item.duration_ms;
  $('pFill').style.width = (pos / dur * 100) + '%';
  $('pPos').textContent = fmtDur(pos); $('pDur').textContent = fmtDur(dur);
  if (fullOpen && !scrubbing) paintFullProgress(pos / dur);
}
function paintFullProgress(f) {
  const dur = ps.item.duration_ms;
  $('fFill').style.width = (f * 100) + '%'; $('fKnob').style.left = (f * 100) + '%';
  $('fPos').textContent = fmtDur(f * dur); $('fDur').textContent = '-' + fmtDur(dur - f * dur);
}
// Senast spelade sparas, så spelaren kan visa den och fortsätta därifrån när Spotify inte spelar något.
let lastSaved = 0;
function saveLast(s) {
  if (Date.now() - lastSaved < 10000 && !s.is_playing === !ps?.is_playing) return;
  lastSaved = Date.now();
  try { store.set('last_played', JSON.stringify({ item: slimTrack(s.item), context: s.context?.uri || null, progress_ms: s.progress_ms || 0 })); } catch {}
}
function lastPlayed() {
  try { const l = JSON.parse(store.get('last_played') || 'null'); if (!l || !l.item) return null;
    return { item: l.item, is_playing: false, progress_ms: l.progress_ms || 0, device: null, context: l.context ? { uri: l.context } : null, stale: true }; }
  catch { return null; }
}
async function resumeLast() {
  const t = ps.item, pos = Math.max(0, Math.round(curPos()));
  const ctx = ps.context?.uri;
  const body = ctx && !ctx.includes(':artist:') ? { context_uri: ctx, offset: { uri: t.uri }, position_ms: pos } : { uris: [t.uri], position_ms: pos };
  $('pIcon').innerHTML = ICON_PAUSE;
  await play(body, t.uri);
}
function updatePlayer(s) {
  if (s && s.item && s.item.type === 'track') saveLast(s);
  else s = lastPlayed();
  if (!s) { ps = null; $('player').classList.remove('on'); document.body.classList.remove('has-player'); markPlaying(null); return; }
  if (ps && ps.stale && s.stale) return;           // redan visad, rör inte lokal spolning
  ps = s; psAt = Date.now();
  const t = s.item;
  const src = bestImage(t.album.images, 64); if ($('pImg').src !== src) $('pImg').src = src;
  $('pTitle').textContent = t.name;
  $('pSub').textContent = artistNames(t.artists) + (s.stale ? ' · Senast spelat' : s.device?.name ? ' · ' + s.device.name : '');
  $('pIcon').innerHTML = s.is_playing ? ICON_PAUSE : ICON_PLAY;
  $('player').classList.add('on'); document.body.classList.add('has-player');
  paintFull();
  paintProgress(); markPlaying(t.uri);
}
function paintFull() {
  if (!ps) return;
  const t = ps.item;
  const big = bestImage(t.album.images, 600);
  if ($('fImg').getAttribute('src') !== big) { $('fImg').src = big; $('fBg').style.backgroundImage = `url("${big}")`; }
  $('fTitle').textContent = t.name;
  $('fArtist').textContent = artistNames(t.artists);
  $('fAlbumName').textContent = t.album.name + (t.album.release_date ? ' · ' + year(t.album.release_date) : '');
  const g = $('fGenres'); g.innerHTML = ''; genresFor(t.album.id).forEach(x => g.appendChild(el('span', null, x)));
  $('fIcon').innerHTML = ps.is_playing ? ICON_PAUSE : ICON_PLAY;
  $('fullp').classList.toggle('paused', !ps.is_playing);
  $('fShuffle').classList.toggle('on', !!ps.shuffle_state);
  $('fRepeat').classList.toggle('on', ps.repeat_state && ps.repeat_state !== 'off');
  $('fOne').hidden = ps.repeat_state !== 'track';
  $('fDev').textContent = ps.stale ? 'Senast spelat · tryck ▶ för att fortsätta' : ps.device?.name ? 'Spelas på ' + ps.device.name : '';
  const ctx = ps.context?.uri || '';
  $('fCtx').textContent = ctx.includes(':album:') ? 'Från albumet' : ctx.includes(':playlist:') ? 'Från spellistan' + (plMap.get(ctx.split(':').pop())?.name ? ' ' + plMap.get(ctx.split(':').pop()).name : '') : 'Spelas nu';
  $('fAlbum').style.visibility = albums.some(a => a.id === t.album.id) ? 'visible' : 'hidden';
}
function markPlaying(uri) {
  document.querySelectorAll('.trk.playing').forEach(e => e.classList.remove('playing'));
  if (uri) document.querySelectorAll(`.trk[data-uri="${CSS.escape(uri)}"]`).forEach(e => e.classList.add('playing'));
}
async function pollPlayer() {
  if (document.hidden || !(store.get('access_token') || store.get('refresh_token'))) return;
  try { updatePlayer(await api('/me/player')); } catch {}
}
function pollSoon(ms = 700) { setTimeout(pollPlayer, ms); }
function startPolling() { clearInterval(pollTimer); pollTimer = setInterval(pollPlayer, 4000); pollPlayer(); }
setInterval(paintProgress, 500);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pollPlayer(); });

$('pPlay').onclick = async () => {
  if (!ps) return;
  if (ps.stale) return resumeLast();
  const wasPlaying = ps.is_playing;
  ps.progress_ms = curPos(); psAt = Date.now(); ps.is_playing = !wasPlaying;
  $('pIcon').innerHTML = ps.is_playing ? ICON_PAUSE : ICON_PLAY; paintFull();
  try { await api('/me/player/' + (wasPlaying ? 'pause' : 'play'), { method: 'PUT' }); } catch (e) { toast('Fel: ' + e.message, 3000); }
  pollSoon();
};
$('pNext').onclick = async () => { if (ps?.stale) return resumeLast(); try { await api('/me/player/next', { method: 'POST' }); } catch (e) { toast('Fel: ' + e.message, 3000); } pollSoon(); };
$('pPrev').onclick = async () => { if (ps?.stale) return resumeLast(); try { await api('/me/player/previous', { method: 'POST' }); } catch (e) { toast('Fel: ' + e.message, 3000); } pollSoon(); };
$('pBar').onclick = async e => {
  if (!ps) return;
  const r = $('pBar').getBoundingClientRect();
  const pos = Math.round(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * ps.item.duration_ms);
  ps.progress_ms = pos; psAt = Date.now(); paintProgress();
  if (ps.stale) return;
  try { await api('/me/player/seek?position_ms=' + pos, { method: 'PUT' }); } catch (e2) { toast('Fel: ' + e2.message, 3000); }
  pollSoon();
};
// ===== Stor spelare: öppnas med tryck på minispelaren, stängs med pil, dra nedåt eller bakåt =====
let fullOpen = false, scrubbing = false;
function openFull() {
  if (!ps || fullOpen) return;
  paintFull(); paintFullProgress(curPos() / ps.item.duration_ms);
  $('fullp').classList.add('on'); document.body.classList.add('locked');
  history.pushState({ full: 1 }, ''); fullOpen = true;
}
function hideFull() { fullOpen = false; $('fullp').classList.remove('on'); $('fullp').style.transform = ''; if (!sheetOpen) document.body.classList.remove('locked'); }
function closeFull() { if (fullOpen) history.back(); }
$('pMeta').onclick = openFull; $('pImg').onclick = openFull;
$('fDown').onclick = closeFull;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && fullOpen) closeFull(); });
$('fAlbum').onclick = $('fAlbumName').onclick = () => {
  const a = ps && albums.find(x => x.id === ps.item.album.id); if (!a) return;
  closeFull(); setTimeout(() => openAlbum(a), 350);
};
$('fPlay').onclick = () => $('pPlay').onclick();
$('fNext').onclick = () => $('pNext').onclick();
$('fPrev').onclick = () => $('pPrev').onclick();
$('fShuffle').onclick = async () => {
  if (!ps) return; ps.shuffle_state = !ps.shuffle_state; paintFull();
  try { await api('/me/player/shuffle?state=' + ps.shuffle_state, { method: 'PUT' }); } catch (e) { toast('Fel: ' + e.message, 3000); } pollSoon();
};
$('fRepeat').onclick = async () => {
  if (!ps) return; const next = { off: 'context', context: 'track', track: 'off' }[ps.repeat_state || 'off'];
  ps.repeat_state = next; paintFull();
  try { await api('/me/player/repeat?state=' + next, { method: 'PUT' }); } catch (e) { toast('Fel: ' + e.message, 3000); } pollSoon();
};
// Dra i tidslinjen för att spola
(() => {
  const bar = $('fBar');
  const frac = e => { const r = bar.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); };
  bar.addEventListener('pointerdown', e => { if (!ps) return; scrubbing = true; bar.setPointerCapture(e.pointerId); paintFullProgress(frac(e)); });
  bar.addEventListener('pointermove', e => { if (scrubbing) paintFullProgress(frac(e)); });
  const end = async e => {
    if (!scrubbing) return; scrubbing = false;
    const pos = Math.round(frac(e) * ps.item.duration_ms);
    ps.progress_ms = pos; psAt = Date.now(); paintProgress();
    if (ps.stale) return;
    try { await api('/me/player/seek?position_ms=' + pos, { method: 'PUT' }); } catch (e2) { toast('Fel: ' + e2.message, 3000); }
    pollSoon();
  };
  bar.addEventListener('pointerup', end); bar.addEventListener('pointercancel', () => { scrubbing = false; });
})();
// Dra nedåt för att minimera
(() => {
  const fp = $('fullp'); let y0 = null, dy = 0;
  fp.addEventListener('touchstart', e => { if (e.target.closest('#fBar')) { y0 = null; return; } y0 = e.touches[0].clientY; dy = 0; }, { passive: true });
  fp.addEventListener('touchmove', e => { if (y0 == null) return; dy = e.touches[0].clientY - y0; if (dy > 0) { fp.style.transition = 'none'; fp.style.transform = `translateY(${dy}px)`; } }, { passive: true });
  fp.addEventListener('touchend', () => { if (y0 == null) return; fp.style.transition = ''; if (dy > 120) closeFull(); else fp.style.transform = ''; y0 = null; });
})();

// ===== Uppspelning (styr Spotify-appen) =====
async function play(body, fallbackUri) {
  try {
    await api('/me/player/play', { method: 'PUT', body: JSON.stringify(body) });
    toast('Spelar ▶'); pollSoon(); return;
  } catch (e) {
    if (e.status !== 404) { toast((e.status === 403 ? 'Spotify nekade: ' : 'Fel: ') + e.message, 4000); return; }
  }
  try {
    const { devices } = await api('/me/player/devices');
    const d = (devices || []).find(x => !x.is_restricted);
    if (d) {
      await api('/me/player/play?device_id=' + encodeURIComponent(d.id), { method: 'PUT', body: JSON.stringify(body) });
      toast('Spelar på ' + d.name + ' ▶'); pollSoon(); return;
    }
  } catch {}
  toast('Ingen aktiv Spotify-enhet, öppnar appen…', 3000);
  if (fallbackUri) setTimeout(() => { location.href = fallbackUri; }, 600);
}

// ===== Start =====
function showLogin(msg) {
  document.body.classList.add('nologin');
  const main = $('main'); main.innerHTML = '';
  const box = el('div', 'center');
  if (msg) { const p = el('p', null, msg); p.style.color = '#f88'; box.appendChild(p); }
  box.appendChild(el('p', null, 'Logga in med Spotify för att visa din hylla.'));
  const b = el('button', 'primary', 'Logga in med Spotify'); b.onclick = login; box.appendChild(b);
  main.appendChild(box);
}

$('sideSearch').oninput = () => {
  query = $('sideSearch').value;
  if (route.view !== 'search') navigate({ view: 'search' }); else { activeQuery = query; const r = $('main').lastElementChild; if (r) renderSearchResults(r); }
};
$('sidePlSearch').oninput = () => { plQuery = $('sidePlSearch').value; renderSide(); };
$('sideSettings').onclick = openSettings;
history.replaceState({ route, d: 0 }, '');
// iOS: tangentbordet flyttar sidan. Göm bottenraderna medan man skriver och lägg tillbaka sidan efteråt.
const isTextField = e => e.target.matches && e.target.matches('input:not([type=checkbox]), textarea');
document.addEventListener('focusin', e => { if (isTextField(e)) document.body.classList.add('typing'); });
document.addEventListener('focusout', e => {
  if (!isTextField(e)) return;
  setTimeout(() => {
    if (document.activeElement && document.activeElement.matches && document.activeElement.matches('input, textarea')) return;
    document.body.classList.remove('typing');
    window.scrollTo(window.scrollX, window.scrollY);
  }, 60);
});

(async () => {
  try {
    await handleRedirect();
    if (!store.get('access_token') && !store.get('refresh_token')) return showLogin();
    document.body.classList.remove('nologin');
    // 1. Visa senast sparade direkt
    const c = readCache();
    let list = []; try { list = JSON.parse(store.get('pl_list_v1') || '[]'); } catch {}
    plMap = new Map(list.map(p => [p.id, p]));
    if (c) { fillPlaylistSelect(list, c.id); curId = c.id; build(c.items); render(); }
    startPolling();
    // 2. Kolla mot Spotify i bakgrunden och hämta bara om spellistan ändrats
    const [pick] = await Promise.all([loadPlaylists(), loadRepoGenres()]);
    if (!pick) { $('main').innerHTML = '<div class="center">Hittade inga spellistor.</div>'; return; }
    if (c) render();
    await loadPlaylist(pick.id);
  } catch (e) {
    if (e.message !== 'Inte inloggad') { if (tracks.length) toast(e.message, 4000); else showLogin(e.message); }
  }
})();
