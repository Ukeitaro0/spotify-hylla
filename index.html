<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111214">
<title>Hyllan</title>
<style>
  :root {
    --bg: #111214; --panel: #1b1c20; --panel2: #24262b; --text: #f2f2f4;
    --muted: #9a9ca5; --accent: #1ed760; --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: env(safe-area-inset-bottom); }
  header { position: sticky; top: 0; z-index: 5; background: rgba(17,18,20,.92);
    backdrop-filter: blur(12px); padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    border-bottom: 1px solid #222; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; flex: 1; }
  select, input, button { font: inherit; color: var(--text); background: var(--panel2);
    border: 1px solid #333; border-radius: 8px; padding: 7px 10px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #000; border: none; font-weight: 600; }
  input[type=search] { flex: 1; min-width: 140px; }
  .tabs { display: flex; gap: 6px; margin-top: 10px; }
  .tabs button { flex: 1; background: transparent; }
  .tabs button.on { background: var(--panel2); border-color: #555; }
  main { padding: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  .card { cursor: pointer; }
  .card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: var(--radius);
    background: var(--panel); display: block; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .card .t { font-size: 14px; font-weight: 600; margin-top: 6px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .card .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  h2 { font-size: 16px; margin: 22px 0 10px; color: var(--muted); font-weight: 600; }
  h2:first-child { margin-top: 0; }
  .list { display: flex; flex-direction: column; gap: 2px; }
  .trk { display: flex; gap: 10px; align-items: center; padding: 6px; border-radius: 8px; cursor: pointer; }
  .trk:hover, .trk:active { background: var(--panel); }
  .trk img { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex: none; }
  .trk .n { width: 22px; text-align: right; color: var(--muted); font-size: 13px; flex: none; }
  .trk .meta { min-width: 0; flex: 1; }
  .trk .t { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trk .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trk .d { font-size: 12px; color: var(--muted); flex: none; }
  .center { text-align: center; padding: 60px 20px; color: var(--muted); }
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 10; display: none; }
  .sheet.on { display: block; }
  .sheet .inner { position: absolute; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow: auto;
    background: var(--panel); border-radius: 16px 16px 0 0; padding: 18px 16px calc(24px + env(safe-area-inset-bottom)); }
  @media (min-width: 800px) {
    .sheet .inner { left: 50%; transform: translateX(-50%); width: 640px; bottom: 5vh; border-radius: 16px; max-height: 90vh; }
  }
  .hero { display: flex; gap: 16px; align-items: flex-end; margin-bottom: 14px; }
  .hero img { width: 140px; height: 140px; border-radius: var(--radius); object-fit: cover; flex: none; }
  .hero .t { font-size: 20px; font-weight: 700; }
  .hero .s { color: var(--muted); font-size: 14px; margin: 4px 0 10px; }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #333; padding: 10px 16px; border-radius: 20px; font-size: 14px; z-index: 20;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; text-align: center; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<header id="hdr" hidden>
  <div class="row">
    <h1>Hyllan</h1>
    <select id="plSel" title="Spellista"></select>
    <button id="reload" title="Ladda om">⟳</button>
  </div>
  <div class="row" style="margin-top:10px">
    <input type="search" id="q" placeholder="Sök artist, album, låt…">
    <select id="sort">
      <option value="artist">Artist A–Ö</option>
      <option value="date">Utgivning (nyast)</option>
      <option value="added">Tillagd (senast)</option>
      <option value="name">Album A–Ö</option>
    </select>
  </div>
  <div class="tabs">
    <button data-tab="albums" class="on">Album</button>
    <button data-tab="artists">Artister</button>
    <button data-tab="loose">Övriga låtar</button>
  </div>
</header>
<main id="main"><div class="center">Laddar…</div></main>
<div class="sheet" id="sheet"><div class="inner" id="sheetInner"></div></div>
<div class="toast" id="toast"></div>

<script>
// ===== Inställningar =====
const CLIENT_ID = '60281313632147df82bb02cdd1691929';
const REDIRECT_URI = location.hostname === 'ukeitaro0.github.io'
  ? 'https://ukeitaro0.github.io/spotify-hylla/'
  : location.origin + location.pathname;
const SCOPES = 'playlist-read-private playlist-read-collaborative user-read-playback-state user-modify-playback-state';
const DEFAULT_PLAYLIST_NAME = '2026';
const MIN_TRACKS_IF_UNKNOWN = 4; // om Spotify inte skickar antal spår på albumet

// ===== Lagring (tål att localStorage saknas) =====
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

const $ = id => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function toast(msg, ms = 2600) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), ms); }

// ===== Inloggning (PKCE, ingen hemlig nyckel) =====
function b64url(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function randomString(n = 64) { const a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a).slice(0, n); }

async function login() {
  const verifier = randomString(64);
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  store.set('pkce_verifier', verifier);
  const p = new URLSearchParams({ client_id: CLIENT_ID, response_type: 'code', redirect_uri: REDIRECT_URI,
    scope: SCOPES, code_challenge_method: 'S256', code_challenge: challenge });
  location.href = 'https://accounts.spotify.com/authorize?' + p;
}

async function tokenRequest(params) {
  const r = await fetch('https://accounts.spotify.com/api/token', { method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(params) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error_description || j.error || 'Inloggning misslyckades');
  store.set('access_token', j.access_token);
  store.set('expires_at', String(Date.now() + (j.expires_in - 60) * 1000));
  if (j.refresh_token) store.set('refresh_token', j.refresh_token);
}

async function handleRedirect() {
  const p = new URLSearchParams(location.search);
  if (p.get('error')) { history.replaceState(null, '', REDIRECT_URI); throw new Error('Spotify sa nej: ' + p.get('error')); }
  const code = p.get('code');
  if (!code) return;
  history.replaceState(null, '', location.pathname);
  await tokenRequest({ client_id: CLIENT_ID, grant_type: 'authorization_code', code,
    redirect_uri: REDIRECT_URI, code_verifier: store.get('pkce_verifier') || '' });
  store.del('pkce_verifier');
}

async function getToken() {
  if (store.get('access_token') && Date.now() < Number(store.get('expires_at') || 0)) return store.get('access_token');
  const rt = store.get('refresh_token');
  if (!rt) return null;
  try { await tokenRequest({ client_id: CLIENT_ID, grant_type: 'refresh_token', refresh_token: rt }); }
  catch { store.del('refresh_token'); store.del('access_token'); return null; }
  return store.get('access_token');
}

// ===== API =====
async function api(path, opts = {}) {
  const token = await getToken();
  if (!token) { showLogin(); throw new Error('Inte inloggad'); }
  const url = path.startsWith('http') ? path : 'https://api.spotify.com/v1' + path;
  const r = await fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (r.status === 429) { const wait = Number(r.headers.get('Retry-After') || 2); await new Promise(res => setTimeout(res, wait * 1000)); return api(path, opts); }
  if (r.status === 204) return null;
  const txt = await r.text();
  const j = txt ? JSON.parse(txt) : null;
  if (!r.ok) { const e = new Error(j?.error?.message || ('HTTP ' + r.status)); e.status = r.status; e.reason = j?.error?.reason; throw e; }
  return j;
}

async function getAll(path) {
  let out = [], next = path;
  while (next) { const page = await api(next); out = out.concat(page.items || []); next = page.next; }
  return out;
}

// ===== Data =====
let playlists = [], tracks = [], albums = [], loose = [];
let tab = 'albums';

function bestImage(imgs, min = 300) {
  if (!imgs || !imgs.length) return '';
  const sorted = [...imgs].sort((a, b) => (a.width || 0) - (b.width || 0));
  return (sorted.find(i => (i.width || 0) >= min) || sorted[sorted.length - 1]).url;
}
const artistNames = list => (list || []).map(a => a.name).join(', ');
const year = d => (d || '').slice(0, 4);
const fmtDur = ms => { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const sortKey = s => (s || '').toLocaleLowerCase('sv').replace(/^the /, '');

async function loadPlaylists() {
  playlists = await getAll('/me/playlists?limit=50');
  const sel = $('plSel'); sel.innerHTML = '';
  playlists.forEach(p => { const o = el('option', null, p.name); o.value = p.id; sel.appendChild(o); });
  const saved = store.get('playlist_id');
  const pick = playlists.find(p => p.id === saved) || playlists.find(p => p.name.trim() === DEFAULT_PLAYLIST_NAME) || playlists[0];
  if (pick) sel.value = pick.id;
  return pick;
}

async function loadPlaylist(id) {
  $('main').innerHTML = '<div class="center">Hämtar låtar…</div>';
  store.set('playlist_id', id);
  const items = await getAll(`/playlists/${id}/items?limit=50`);
  tracks = items.map(it => ({ t: it.item || it.track, added: it.added_at }))
    .filter(x => x.t && x.t.type !== 'episode' && x.t.album && !x.t.is_local);

  const byAlbum = new Map();
  tracks.forEach(({ t, added }) => {
    const a = t.album;
    if (!byAlbum.has(a.id)) byAlbum.set(a.id, { album: a, items: [] });
    const g = byAlbum.get(a.id);
    if (!g.items.some(x => x.t.id === t.id)) g.items.push({ t, added });
  });

  albums = []; loose = [];
  for (const g of byAlbum.values()) {
    const a = g.album, n = g.items.length;
    const total = a.total_tracks;
    const isSingleTrack = (total === 1) || (a.album_type === 'single' && n === 1);
    const complete = total ? n >= total : n >= MIN_TRACKS_IF_UNKNOWN;
    g.items.sort((x, y) => (x.t.disc_number - y.t.disc_number) || (x.t.track_number - y.t.track_number));
    if (complete && !isSingleTrack) {
      albums.push({ id: a.id, uri: a.uri, name: a.name, artist: artistNames(a.artists), date: a.release_date,
        img: bestImage(a.images), imgBig: bestImage(a.images, 600), items: g.items,
        added: g.items.reduce((m, x) => x.added > m ? x.added : m, '') });
    } else {
      g.items.forEach(x => loose.push(x));
    }
  }
  render();
}

// ===== Visning =====
function matches(...fields) {
  const q = sortKey($('q').value.trim());
  return !q || fields.some(f => sortKey(f).includes(q));
}

function sortedAlbums(list) {
  const s = $('sort').value, c = (a, b) => a.localeCompare(b, 'sv');
  return [...list].sort((a, b) =>
    s === 'date' ? (b.date || '').localeCompare(a.date || '') :
    s === 'added' ? (b.added || '').localeCompare(a.added || '') :
    s === 'name' ? c(sortKey(a.name), sortKey(b.name)) :
    c(sortKey(a.artist), sortKey(b.artist)) || (a.date || '').localeCompare(b.date || ''));
}

function albumCard(a) {
  const c = el('div', 'card');
  const img = el('img'); img.loading = 'lazy'; img.alt = ''; img.src = a.img; c.appendChild(img);
  c.appendChild(el('div', 't', a.name));
  c.appendChild(el('div', 's', a.artist + (a.date ? ' · ' + year(a.date) : '')));
  c.onclick = () => openAlbum(a);
  return c;
}

function trackRow(t, { num, onPlay, showCover = true }) {
  const r = el('div', 'trk');
  if (showCover) { const img = el('img'); img.loading = 'lazy'; img.alt = ''; img.src = bestImage(t.album.images, 64); r.appendChild(img); }
  else r.appendChild(el('div', 'n', String(num)));
  const m = el('div', 'meta');
  m.appendChild(el('div', 't', t.name));
  m.appendChild(el('div', 's', artistNames(t.artists) + (showCover ? ' · ' + t.album.name : '')));
  r.appendChild(m);
  r.appendChild(el('div', 'd', fmtDur(t.duration_ms)));
  r.onclick = onPlay;
  return r;
}

function render() {
  const main = $('main'); main.innerHTML = '';
  if (!tracks.length) { main.innerHTML = '<div class="center">Spellistan är tom, eller går inte att läsa (Spotify lämnar bara ut innehåll i listor du äger eller samarbetar på).</div>'; return; }

  if (tab === 'albums') {
    const list = sortedAlbums(albums.filter(a => matches(a.name, a.artist)));
    if (!list.length) { main.appendChild(el('div', 'center', 'Inga hela album hittades.')); return; }
    const g = el('div', 'grid'); list.forEach(a => g.appendChild(albumCard(a))); main.appendChild(g);
  }

  if (tab === 'artists') {
    const byArtist = new Map();
    albums.filter(a => matches(a.name, a.artist)).forEach(a => { (byArtist.get(a.artist) || byArtist.set(a.artist, []).get(a.artist)).push(a); });
    const names = [...byArtist.keys()].sort((a, b) => sortKey(a).localeCompare(sortKey(b), 'sv'));
    if (!names.length) { main.appendChild(el('div', 'center', 'Inga träffar.')); return; }
    names.forEach(n => {
      main.appendChild(el('h2', null, n));
      const g = el('div', 'grid');
      byArtist.get(n).sort((a, b) => (b.date || '').localeCompare(a.date || '')).forEach(a => g.appendChild(albumCard(a)));
      main.appendChild(g);
    });
  }

  if (tab === 'loose') {
    const s = $('sort').value;
    const list = loose.filter(x => matches(x.t.name, artistNames(x.t.artists), x.t.album.name)).sort((a, b) =>
      s === 'added' ? (b.added || '').localeCompare(a.added || '') :
      s === 'date' ? (b.t.album.release_date || '').localeCompare(a.t.album.release_date || '') :
      s === 'name' ? sortKey(a.t.name).localeCompare(sortKey(b.t.name), 'sv') :
      sortKey(artistNames(a.t.artists)).localeCompare(sortKey(artistNames(b.t.artists)), 'sv'));
    if (!list.length) { main.appendChild(el('div', 'center', 'Inga lösa låtar.')); return; }
    const playBtn = el('button', 'primary', '▶ Spela alla ' + list.length);
    playBtn.style.marginBottom = '12px';
    const uris = list.map(x => x.t.uri);
    playBtn.onclick = () => play({ uris });
    main.appendChild(playBtn);
    const l = el('div', 'list');
    list.forEach((x, i) => l.appendChild(trackRow(x.t, { onPlay: () => play({ uris, offset: { position: i } }, x.t.uri) })));
    main.appendChild(l);
  }
}

function openAlbum(a) {
  const inner = $('sheetInner'); inner.innerHTML = '';
  const hero = el('div', 'hero');
  const img = el('img'); img.src = a.imgBig; img.alt = ''; hero.appendChild(img);
  const info = el('div');
  info.appendChild(el('div', 't', a.name));
  info.appendChild(el('div', 's', a.artist + (a.date ? ' · ' + year(a.date) : '') + ' · ' + a.items.length + ' låtar'));
  const pb = el('button', 'primary', '▶ Spela'); pb.onclick = () => play({ context_uri: a.uri }, a.uri);
  info.appendChild(pb);
  hero.appendChild(info); inner.appendChild(hero);
  const l = el('div', 'list');
  a.items.forEach(x => l.appendChild(trackRow(x.t, { num: x.t.track_number, showCover: false,
    onPlay: () => play({ context_uri: a.uri, offset: { uri: x.t.uri } }, x.t.uri) })));
  inner.appendChild(l);
  $('sheet').classList.add('on');
}
$('sheet').onclick = e => { if (e.target.id === 'sheet') $('sheet').classList.remove('on'); };

// ===== Uppspelning (styr Spotify-appen) =====
async function play(body, fallbackUri) {
  try {
    await api('/me/player/play', { method: 'PUT', body: JSON.stringify(body) });
    toast('Spelar ▶'); return;
  } catch (e) {
    if (e.status !== 404 && e.reason !== 'NO_ACTIVE_DEVICE') { if (e.status === 403) toast('Spotify nekade: ' + e.message, 4000); else toast('Fel: ' + e.message, 4000); if (e.status !== 404) return; }
  }
  // Ingen aktiv enhet: försök väcka en känd enhet
  try {
    const { devices } = await api('/me/player/devices');
    const d = (devices || []).find(x => !x.is_restricted);
    if (d) {
      await api('/me/player/play?device_id=' + encodeURIComponent(d.id), { method: 'PUT', body: JSON.stringify(body) });
      toast('Spelar på ' + d.name + ' ▶'); return;
    }
  } catch {}
  // Sista utvägen: öppna i Spotify-appen
  toast('Ingen aktiv Spotify-enhet, öppnar appen…', 3000);
  if (fallbackUri) setTimeout(() => { location.href = fallbackUri; }, 600);
}

// ===== Start =====
function showLogin(msg) {
  $('hdr').hidden = true;
  const main = $('main'); main.innerHTML = '';
  const box = el('div', 'center');
  if (msg) { const p = el('p', null, msg); p.style.color = '#f77'; box.appendChild(p); }
  box.appendChild(el('p', null, 'Logga in med Spotify för att visa din hylla.'));
  const b = el('button', 'primary', 'Logga in med Spotify'); b.onclick = login; box.appendChild(b);
  main.appendChild(box);
}

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  tab = b.dataset.tab; render(); window.scrollTo(0, 0);
});
$('q').oninput = render;
$('sort').onchange = () => { store.set('sort', $('sort').value); render(); };
$('plSel').onchange = () => loadPlaylist($('plSel').value).catch(err => toast(err.message, 4000));
$('reload').onclick = () => loadPlaylist($('plSel').value).catch(err => toast(err.message, 4000));
if (store.get('sort')) $('sort').value = store.get('sort');

(async () => {
  try {
    await handleRedirect();
    if (!(await getToken())) return showLogin();
    $('hdr').hidden = false;
    const pick = await loadPlaylists();
    if (!pick) { $('main').innerHTML = '<div class="center">Hittade inga spellistor.</div>'; return; }
    await loadPlaylist(pick.id);
  } catch (e) {
    if (e.message !== 'Inte inloggad') showLogin(e.message);
  }
})();
</script>
</body>
</html>
